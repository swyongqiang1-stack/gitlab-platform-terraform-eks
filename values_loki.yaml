deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: 463884819678-loki
      ruler: 463884819678-loki
    s3:
      region: ap-southeast-1

  limits_config:
    retention_period: 168h

  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 3Gi

  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi

serviceAccount:
  create: false
  name: loki

minio:
  enabled: false

gateway:
  enabled: true

chunksCache:
  enabled: false

resultsCache:
  enabled: false

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

monitoring:
  serviceMonitor:
    enabled: true