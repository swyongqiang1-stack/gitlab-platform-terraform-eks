global:
  logging:
    format: json
    level: info

  additionalLabels:
    project: gitlab
    environment: lab

configs:
  cm:
    admin.enabled: true
    timeout.reconciliation: 120s

  params:
    server.insecure: false

controller:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

  metrics:
    enabled: true

repoServer:
  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

  metrics:
    enabled: true

server:
  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  service:
    type: ClusterIP

  ingress:
    enabled: false

  metrics:
    enabled: true

redis:
  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

redis-ha:
  enabled: false

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

crds:
  install: true
  keep: true