clusterName: gitlab
region: ap-southeast-1

replicaCount: 2

serviceAccount:
  create: false
  name: alb-sa

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

defaultTags:
  Project: gitlab
  ManagedBy: terraform
  Component: load-balancer

defaultTargetType: ip

podDisruptionBudget:
  maxUnavailable: 1

serviceMonitor:
  enabled: true