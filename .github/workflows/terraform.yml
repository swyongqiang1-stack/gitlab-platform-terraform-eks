name: Terraform CI

on:
  #workflow_dispatch:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/.terraform.lock.hcl"
      - "bootstrap/**"
      - "gitlab-storage/**"
      - "k8s/**"
      - "tests/**"
      - "**/*.yaml"
      - "**/*.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/.terraform.lock.hcl"
      - "bootstrap/**"
      - "gitlab-storage/**"
      - "k8s/**"
      - "tests/**"
      - "**/*.yaml"
      - "**/*.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:

  check:
    name: Terraform Check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - "bootstrap"
          - "gitlab-storage"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform -chdir=${{ matrix.directory }} fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=${{ matrix.directory }} init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.directory }} validate -no-color


  plan:
    name: Terraform Plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: AWS Login with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false