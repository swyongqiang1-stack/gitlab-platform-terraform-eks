global:
  hosts:
    domain: erben.cn
    https: true
    gitlab:
      name: gitlab.erben.cn
  appConfig:
    object_store:
      enabled: true

  serviceAccount:
    enabled: true
    create: false
    name: gitlab-s3-sa

  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false

  ingress:
    enabled: true
    class: none
    provider: aws
    path: /*
    pathType: ImplementationSpecific
    configureCertmanager: false
    tls:
      enabled: false

    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: gitlab
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  psql:
    port: 5432
    username: gitlabadmin
    database: gitlabhq_production

    password:
      secret: gitlab-database-secret
      key: password

  redis:
    port: 6379
    scheme: rediss

    auth:
      enabled: true
      secret: gitlab-redis
      key: password



    connection:
      secret: gitlab-s3-config
      key: connection

  artifacts:
    bucket: 463884819678-artifacts

  lfs:
    bucket: 463884819678-lfs

  uploads:
    bucket: 463884819678-uploads

  packages:
    bucket: 463884819678-packages

  backups:
    bucket: 463884819678-backups
    tmpBucket: 463884819678-backup-tmp


gitlab:
  webservice:
    minReplicas: 2
    maxReplicas: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  sidekiq:
    minReplicas: 1
    maxReplicas: 1

  gitaly:
    persistence:
      enabled: true
      storageClass: gp3
      size: 50Gi

registry:
  enabled: false

nginx-ingress:
  enabled: false

installCertmanager: false

gitlab-runner:
  install: false

prometheus:
  install: false