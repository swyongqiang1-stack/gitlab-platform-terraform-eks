replicaCount: 1

serviceAccount:
  create: false
  name: external-dns-sa

rbac:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

sources:
  - ingress

provider:
  name: aws

domainFilters:
  - erben.cn

extraArgs:
  aws-zone-type: public

policy: upsert-only

registry: txt
txtOwnerId: gitlab-eks

interval: 1m
logLevel: info

serviceMonitor:
  enabled: true

commonLabels:
  Project: gitlab
  ManagedBy: terraform
  Component: external-dns