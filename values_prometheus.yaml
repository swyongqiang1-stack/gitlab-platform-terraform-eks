prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1

    scrapeInterval: 30s
    retention: 7d

    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi


grafana:
  enabled: true

  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi


alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1


kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
